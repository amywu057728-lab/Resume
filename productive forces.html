<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人化 Kanban 任務看板</title>
    <!-- Google Fonts: Shippori Mincho for titles, Noto Sans TC for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f5f3ee;
            --bg-column: #edeae3;
            --bg-card: #ffffff;
            --border-color: #d8d3c8;
            --focus-orange: #e67e22;
            --text-primary: #33322e;
            --text-secondary: #6e6b63;
            
            /* Counter & Badge Colors */
            --tag-todo: #6c8dae;       /* 霧藍色 */
            --tag-progress: #d39e00;   /* 芥末黃 */
            --tag-done: #7a9a7a;       /* 鼠尾草綠 */
            --tag-calendar-text: #fcfbf9; /* 米白色 */
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', sans-serif;
            padding: 24px 16px;
            max-width: 1200px;
            margin: 0 auto;
            line-height: 1.5;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        h1, h2, h3 {
            font-family: 'Shippori Mincho', serif;
            font-weight: 800;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 820px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background-color: var(--bg-column);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            min-height: 480px;
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .column-title {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            padding: 2px 10px;
            border-radius: var(--radius);
            font-family: 'Noto Sans TC', sans-serif;
        }

        .counter-todo { background-color: var(--tag-todo); }
        .counter-progress { background-color: var(--tag-progress); }
        .counter-done { background-color: var(--tag-done); }

        .task-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 16px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s ease;
        }

        .card-content {
            font-size: 0.95rem;
            word-break: break-word;
            color: var(--text-primary);
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .card-date {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: var(--bg-main);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        button {
            font-family: 'Noto Sans TC', sans-serif;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            outline: none;
        }

        button:hover:not(:disabled) {
            border-color: var(--focus-orange);
            color: var(--focus-orange);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-delete {
            margin-left: auto;
            color: #c0392b;
            border-color: #e0b4b0;
        }

        .btn-delete:hover {
            background-color: #fdf2f2;
            border-color: #c0392b !important;
            color: #c0392b !important;
        }

        .column-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-column);
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background-color: #ffffff;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            border-color: var(--focus-orange);
        }

        /* Customizing native browser date input arrow */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .btn-add {
            background-color: var(--text-primary);
            color: #ffffff;
            border: none;
            padding: 8px;
            font-weight: 500;
        }

        .btn-add:hover {
            background-color: var(--focus-orange);
            color: #ffffff !important;
        }

        .calendar-section {
            background-color: var(--bg-column);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .calendar-title {
            font-size: 1.3rem;
        }

        .calendar-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 8px 0;
            color: var(--text-secondary);
        }

        .calendar-cell {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            min-height: 90px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .calendar-cell.other-month {
            opacity: 0.35;
            background-color: transparent;
        }

        .calendar-cell.today {
            border: 2px solid var(--focus-orange);
        }

        .day-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        /* Calendar Task Tag Requirement: Sage Green Bg, Off-White Text, Rounded Rectangle, Max 6 chars */
        .calendar-task-tag {
            background-color: var(--tag-done);
            color: var(--tag-calendar-text);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: var(--radius);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            cursor: default;
        }
    </style>
</head>
<body>

    <header>
        <h1>個人任務看板</h1>
        <p>輕量簡約・即時同步・掌握進度</p>
    </header>

    <main class="kanban-board">
        <!-- 待辦 欄位 -->
        <section class="column" id="col-todo">
            <div class="column-header">
                <h2 class="column-title">待辦</h2>
                <span class="counter-badge counter-todo" id="count-todo">0</span>
            </div>
            <div class="task-list" id="list-todo"></div>
            <div class="column-footer">
                <input type="text" id="input-todo-title" placeholder="輸入待辦任務名稱..." />
                <input type="date" id="input-todo-date" title="選擇預計完成日期" />
                <button class="btn-add" onclick="addTask('todo')">新增任務</button>
            </div>
        </section>

        <!-- 進行中 欄位 -->
        <section class="column" id="col-progress">
            <div class="column-header">
                <h2 class="column-title">進行中</h2>
                <span class="counter-badge counter-progress" id="count-progress">0</span>
            </div>
            <div class="task-list" id="list-progress"></div>
            <div class="column-footer">
                <input type="text" id="input-progress-title" placeholder="輸入進行中任務名稱..." />
                <input type="date" id="input-progress-date" title="選擇預計完成日期" />
                <button class="btn-add" onclick="addTask('in-progress')">新增任務</button>
            </div>
        </section>

        <!-- 完成 欄位 -->
        <section class="column" id="col-done">
            <div class="column-header">
                <h2 class="column-title">完成</h2>
                <span class="counter-badge counter-done" id="count-done">0</span>
            </div>
            <div class="task-list" id="list-done"></div>
            <div class="column-footer">
                <input type="text" id="input-done-title" placeholder="輸入已完成任務名稱..." />
                <button class="btn-add" onclick="addTask('done')">新增任務</button>
            </div>
        </section>
    </main>

    <section class="calendar-section">
        <div class="calendar-header">
            <h2 class="calendar-title" id="calendar-month-year">2026 年 8 月</h2>
            <div class="calendar-controls">
                <button onclick="changeMonth(-1)">&lt; 上個月</button>
                <button onclick="resetToToday()">今天</button>
                <button onclick="changeMonth(1)">下個月 &gt;</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <script>
        const STORAGE_KEY = 'kanban_board_tasks_v2';

        // App State
        let tasks = [];
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0 - 11

        // Initialize App on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderBoard();
            renderCalendar();
        });

        // Save & Load
        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function loadTasks() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                } catch (e) {
                    tasks = [];
                }
            } else {
                // Initial Default Tasks for nice UX
                const todayStr = getFormattedDate(new Date());
                tasks = [
                    { id: '1', title: '完成專案簡報草稿', date: todayStr, status: 'todo' },
                    { id: '2', title: '與團隊討論視覺風格', date: todayStr, status: 'in-progress' },
                    { id: '3', title: '設定 Kanban 基本架構', date: '', status: 'done' }
                ];
                saveTasks();
            }
        }

        function addTask(status) {
            let titleInput, dateInput;
            if (status === 'todo') {
                titleInput = document.getElementById('input-todo-title');
                dateInput = document.getElementById('input-todo-date');
            } else if (status === 'in-progress') {
                titleInput = document.getElementById('input-progress-title');
                dateInput = document.getElementById('input-progress-date');
            } else {
                titleInput = document.getElementById('input-done-title');
            }

            const title = titleInput.value.trim();
            const date = dateInput ? dateInput.value : '';

            if (!title) {
                titleInput.focus();
                return;
            }

            const newTask = {
                id: Date.now().toString(),
                title: title,
                date: date,
                status: status
            };

            tasks.push(newTask);
            saveTasks();

            titleInput.value = '';
            if (dateInput) dateInput.value = '';

            renderBoard();
            renderCalendar();
        }

        function moveTask(id, direction) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const flow = ['todo', 'in-progress', 'done'];
            const currentIndex = flow.indexOf(task.status);
            
            if (direction === 'left' && currentIndex > 0) {
                task.status = flow[currentIndex - 1];
            } else if (direction === 'right' && currentIndex < flow.length - 1) {
                task.status = flow[currentIndex + 1];
            }

            saveTasks();
            renderBoard();
            renderCalendar();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderBoard();
            renderCalendar();
        }

        function renderBoard() {
            const listTodo = document.getElementById('list-todo');
            const listProgress = document.getElementById('list-progress');
            const listDone = document.getElementById('list-done');

            listTodo.innerHTML = '';
            listProgress.innerHTML = '';
            listDone.innerHTML = '';

            let counts = { 'todo': 0, 'in-progress': 0, 'done': 0 };

            tasks.forEach(task => {
                counts[task.status] = (counts[task.status] || 0) + 1;
                const cardEl = createCardElement(task);

                if (task.status === 'todo') {
                    listTodo.appendChild(cardEl);
                } else if (task.status === 'in-progress') {
                    listProgress.appendChild(cardEl);
                } else if (task.status === 'done') {
                    listDone.appendChild(cardEl);
                }
            });

            // Update Counters
            document.getElementById('count-todo').textContent = counts['todo'];
            document.getElementById('count-progress').textContent = counts['in-progress'];
            document.getElementById('count-done').textContent = counts['done'];
        }

        function createCardElement(task) {
            const card = document.createElement('div');
            card.className = 'card';

            const isLeftDisabled = task.status === 'todo';
            const isRightDisabled = task.status === 'done';

            card.innerHTML = `
                <div class="card-content">${escapeHTML(task.title)}</div>
                ${task.date ? `<div class="card-meta"><span class="card-date">📅 ${task.date}</span></div>` : ''}
                <div class="card-actions">
                    <button ${isLeftDisabled ? 'disabled' : ''} onclick="moveTask('${task.id}', 'left')" title="向左移">←</button>
                    <button ${isRightDisabled ? 'disabled' : ''} onclick="moveTask('${task.id}', 'right')" title="向右移">→</button>
                    <button class="btn-delete" onclick="deleteTask('${task.id}')">刪除</button>
                </div>
            `;
            return card;
        }

        function renderCalendar() {
            const monthYearTitle = document.getElementById('calendar-month-year');
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // Update Header Title
            monthYearTitle.textContent = `${currentYear} 年 ${currentMonth + 1} 月`;

            // Day Names Header
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                grid.appendChild(dayHeader);
            });

            // Date calculations
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            const today = new Date();
            const todayFormatted = getFormattedDate(today);

            // Filter active tasks (todo & in-progress) with date
            const activeTasksWithDate = tasks.filter(t => 
                (t.status === 'todo' || t.status === 'in-progress') && t.date
            );

            // Previous Month Padding Cells
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell other-month';
                cell.innerHTML = `<span class="day-number">${daysInPrevMonth - i}</span>`;
                grid.appendChild(cell);
            }

            // Current Month Cells
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';

                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (dateStr === todayFormatted) {
                    cell.classList.add('today');
                }

                const dayNum = document.createElement('span');
                dayNum.className = 'day-number';
                dayNum.textContent = day;
                cell.appendChild(dayNum);

                // Add task tags for this date
                const matchedTasks = activeTasksWithDate.filter(t => t.date === dateStr);
                matchedTasks.forEach(task => {
                    const tag = document.createElement('div');
                    tag.className = 'calendar-task-tag';
                    // Show first 6 characters
                    const shortTitle = task.title.length > 6 ? task.title.slice(0, 6) : task.title;
                    tag.textContent = shortTitle;
                    tag.title = `${task.title} (${task.status === 'todo' ? '待辦' : '進行中'})`;
                    cell.appendChild(tag);
                });

                grid.appendChild(cell);
            }

            // Next Month Padding Cells to complete 6 rows (42 total cells)
            const totalRendered = firstDayOfMonth + daysInMonth;
            const remainingCells = (42 - totalRendered) % 7;
            for (let i = 1; i <= remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell other-month';
                cell.innerHTML = `<span class="day-number">${i}</span>`;
                grid.appendChild(cell);
            }
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function resetToToday() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            renderCalendar();
        }

        function getFormattedDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
